  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="KAKOLARK — jogo social de dedução com palavras secretas e personagens Makako">
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>KAKOLARK — V7 Online</title>
  <style>
:root{
  --bg:#12082a;--panel:#201044;--panel2:#2c155d;--purple:#6532c9;--violet:#9a71ff;--lav:#d8c8ff;
  --yellow:#ffd447;--orange:#f59a2b;--red:#f34f69;--green:#55e0a0;--white:#fff;--muted:#bdb0dc;--border:rgba(193,164,255,.25);
  --shadow:0 18px 45px rgba(0,0,0,.35);
}
*{box-sizing:border-box} html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--white);font-family:Inter,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% -10%,#4d22a2 0,transparent 40%),radial-gradient(circle at 10% 20%,rgba(113,56,225,.15),transparent 23%),linear-gradient(180deg,#1b0b3a,#100720 78%);}
button,input,select,textarea{font:inherit} button{cursor:pointer} button:disabled{opacity:.45;cursor:not-allowed}
.app-shell{width:min(1140px,100%);margin:0 auto;padding:18px 22px 12px;min-height:100vh;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.brand{position:relative;border:0;background:transparent;color:var(--yellow);font-size:clamp(1.35rem,3vw,2rem);font-weight:1000;letter-spacing:-1px;text-shadow:0 3px #7e3e0b,0 5px 0 #32115e,2px 7px 0 #32115e;padding:4px 2px;display:flex;align-items:center;gap:7px}
.brand-crown{font-size:1.2em;color:var(--yellow);text-shadow:0 2px #7e3e0b}
.topbar-right{display:flex;align-items:center;gap:10px}.v1-badge{font-size:.72rem;font-weight:850;letter-spacing:.06em;color:#e4d6ff;border:1px solid #7855bd;background:#2a1455;border-radius:999px;padding:7px 11px}
.icon-btn{height:36px;width:36px;border-radius:12px;border:1px solid #8f73d3;background:#382074;color:white;font-weight:900}
.footer{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-size:.82rem;color:#ad99db;padding:8px 0 2px;margin-top:auto}.footer span:first-child{color:var(--yellow);font-weight:900;letter-spacing:.08em}
.notice{padding:11px 14px;border-radius:14px;background:#321d61;border:1px solid #8c66d8;color:#f3edff;font-size:.9rem}.notice.warn{border-color:#f6bc38;background:#382b25}.notice.error{border-color:#f34f69;background:#42162a}.notice.success{border-color:#42d69a;background:#12372f}.hidden{display:none!important}
.screen{animation:show .22s ease-out}@keyframes show{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.panel{border:1px solid var(--border);background:linear-gradient(155deg,rgba(54,30,104,.9),rgba(26,12,52,.94));border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.panel-lite{background:rgba(44,21,93,.65);border:1px solid var(--border);border-radius:16px;padding:14px}
.section-title{font-size:clamp(1.2rem,2.5vw,1.7rem);margin:0 0 8px;font-weight:950;letter-spacing:-.03em}.section-sub{margin:0;color:var(--muted);line-height:1.55;font-size:.96rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.15em;color:#c1a8ff;font-weight:900}.gold-text{color:var(--yellow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:15px;padding:13px 18px;font-weight:950;letter-spacing:.025em;transition:transform .14s,filter .14s,box-shadow .14s;text-align:center}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn-primary{color:#2d1557;background:linear-gradient(180deg,#ffe47c 0%,#ffd342 62%,#ffad24 100%);box-shadow:0 4px 0 #9a4e09,0 8px 20px rgba(255,190,50,.13);border-color:#fff0a0}
.btn-secondary{background:linear-gradient(180deg,#8052df,#5323b4);color:white;border-color:#b39aff;box-shadow:0 4px 0 #311164}
.btn-ghost{background:#251348;color:#e8ddff;border-color:#6946a9}.btn-danger{background:#64203a;color:#ffd9e1;border-color:#c44160}.btn-sm{padding:9px 12px;border-radius:11px;font-size:.86rem}.btn-block{width:100%}.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label,.field-label{font-size:.85rem;color:#dfd3ff;font-weight:800}.input,.select,.textarea{width:100%;min-width:0;border:1px solid #997bdb;background:rgba(16,7,37,.72);color:#fff;border-radius:12px;padding:12px 14px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,212,71,.12)}.input::placeholder,.textarea::placeholder{color:#9482bd}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field small,.helper{color:var(--muted);font-size:.8rem;line-height:1.4}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* Home */
.home{max-width:570px;margin:2px auto 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;padding:4px 8px 16px;width:100%}.home-logo{font-size:clamp(2.5rem,8vw,4.4rem);line-height:1;font-weight:1000;letter-spacing:-.065em;color:#ffd64d;text-shadow:0 3px #f08d22,0 6px #4a1d91,0 9px #190a36,-2px -2px #fff3ba}.home-subtitle{margin:0;color:#e1d5ff;font-weight:750}.hero-avatar-wrap{position:relative;width:min(285px,68vw);aspect-ratio: .75;display:flex;align-items:center;justify-content:center;margin:0 auto -4px}.hero-ring{position:absolute;inset:7% 8% 7%;border-radius:48%;background:radial-gradient(circle,#ffd956 0,#7b40e0 57%,rgba(87,38,182,.1) 71%);box-shadow:0 0 0 7px rgba(255,216,80,.9),0 0 0 12px rgba(134,96,246,.85),0 18px 42px rgba(0,0,0,.35)}.home .avatar-stage{width:86%;height:100%;position:relative;z-index:1}.edit-avatar{position:absolute;right:2%;bottom:18%;z-index:12;width:48px;height:48px;border-radius:16px;border:2px solid #d8c9ff;background:#7744de;color:white;box-shadow:0 4px 0 #331165;font-size:1.25rem}.nickname-wrap{width:min(430px,100%)}.nickname-wrap .input{text-align:center;padding:15px;font-weight:800;font-size:1.12rem;background:#26105c;border:2px solid #9b81e1;border-radius:15px}.home-actions{width:min(430px,100%);display:grid;gap:14px}.home-actions .btn{min-height:62px;font-size:1.15rem;border-radius:18px}
.demo-note{font-size:.76rem;color:#9e8acb;max-width:440px;line-height:1.5}
/* Avatar compositing */
.avatar-stage{position:relative;isolation:isolate;aspect-ratio: .751;overflow:visible;flex:none}.avatar-layer{position:absolute;pointer-events:none;user-select:none;object-fit:fill;max-width:none;max-height:none}.avatar-base{left:0;top:0;width:100%;height:100%;object-fit:contain;z-index:1}.avatar-short-hair{left:16%;top:-1%;width:68%;height:auto;z-index:5}.avatar-long-hair{left:14%;top:-1%;width:72%;height:auto;z-index:4}.avatar-eyes{left:20%;top:21%;width:60%;height:auto;z-index:7}.avatar-muzzle{left:28%;top:29%;width:44%;height:auto;z-index:8}.avatar-facial{left:25%;top:36%;width:50%;height:auto;z-index:9}.avatar-outfit{left:10%;top:47%;width:80%;height:49%;z-index:3;object-fit:fill}.avatar-accessory{z-index:10;height:auto;object-fit:contain}.avatar-small{width:56px;height:74px;position:relative;flex-shrink:0}.avatar-small .avatar-short-hair{top:-1%}.avatar-small .avatar-eyes{top:21%}.avatar-small .avatar-muzzle{top:29%}.avatar-small .avatar-outfit{top:47%;height:47%}
.avatar-editor{display:grid;grid-template-columns:minmax(250px, .85fr) minmax(0,1.65fr);gap:20px;align-items:start}.avatar-preview-panel{position:sticky;top:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}.avatar-preview-panel .avatar-stage{width:min(270px,100%)}.preview-swatch{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}.tiny-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.25)}.avatar-edit-right{min-width:0}.category-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.category-tab{border:1px solid #6545a1;color:#d9cbff;background:#241346;border-radius:999px;padding:9px 12px;font-weight:850;font-size:.82rem}.category-tab.active{background:var(--yellow);border-color:#fff1a7;color:#311558}.option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.option-card{min-width:0;position:relative;overflow:hidden;border:1px solid #5c3d96;border-radius:15px;background:rgba(17,8,40,.68);padding:8px;display:flex;flex-direction:column;gap:8px;color:#efe8ff;text-align:left;transition:transform .12s,border .12s,background .12s}.option-card:hover{transform:translateY(-2px);border-color:#b69aff}.option-card.selected{border:2px solid var(--yellow);background:linear-gradient(160deg,#4a2c8b,#261349);box-shadow:0 0 0 2px rgba(255,212,71,.1)}.option-art{height:95px;background:rgba(255,255,255,.04);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.option-art img{max-height:90%;max-width:95%;object-fit:contain}.option-card .option-name{font-weight:800;font-size:.8rem;line-height:1.3}.option-card .option-num{position:absolute;top:6px;right:6px;font-size:.67rem;color:var(--yellow);font-weight:950}.no-option-art{font-size:2rem;color:#ae98e6}.gender-switch{display:flex;padding:4px;background:#160b31;border:1px solid #573b89;border-radius:14px;gap:4px}.gender-switch button{flex:1;border:0;background:transparent;border-radius:10px;color:#c7b8ea;padding:10px;font-weight:900}.gender-switch button.active{background:#6d3bcb;color:#fff}
/* Rooms */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}.page-head h1{font-size:clamp(1.45rem,4vw,2.25rem);line-height:1.1;margin:5px 0 8px;font-weight:1000;letter-spacing:-.04em}.page-head p{margin:0;color:var(--muted);line-height:1.5}.step-badge{border:1px solid #8667c2;background:#2a1553;color:#e7dbff;border-radius:999px;padding:8px 10px;white-space:nowrap;font-size:.75rem;font-weight:900}.room-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.room-card{display:flex;align-items:center;gap:12px;padding:14px;background:rgba(28,13,60,.85);border:1px solid var(--border);border-radius:15px}.room-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#42257e;font-size:1.35rem;flex-shrink:0}.room-card-info{flex:1;min-width:0}.room-card-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.room-card-info small{display:block;color:var(--muted);margin-top:3px}.empty-state{text-align:center;padding:32px 15px;border:1px dashed #6d51a0;border-radius:15px;color:#c5b5eb;background:rgba(18,7,40,.28)}.empty-state .empty-icon{font-size:2rem;margin-bottom:6px}
.room-code{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:1000;letter-spacing:.15em;color:var(--yellow);background:#160a2e;border:1px dashed #8b6ed4;border-radius:14px;padding:15px;text-align:center}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--border);padding-bottom:9px;margin:12px 0 18px;flex-wrap:wrap}.tab-btn{border:1px solid transparent;border-radius:11px;background:transparent;color:#bfaeea;padding:10px 13px;font-weight:900}.tab-btn.active{background:#39206c;color:#fff;border-color:#8867cb}.player-list{display:grid;gap:9px}.player-row{display:flex;align-items:center;gap:10px;background:rgba(16,7,37,.46);border:1px solid rgba(173,144,237,.14);border-radius:13px;padding:10px}.player-symbol{height:39px;width:39px;border-radius:13px;background:var(--player-color,#8456db);display:grid;place-items:center;font-weight:1000;color:#fff;border:1px solid rgba(255,255,255,.4);flex-shrink:0}.player-row .grow{flex:1;min-width:0}.player-row small{color:var(--muted);display:block}.player-tag{color:#dbcaff;font-size:.72rem;border:1px solid #6548a3;border-radius:999px;padding:5px 7px;white-space:nowrap}
.settings-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:15px;border-top:1px solid var(--border)}.code-info-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.custom-word-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.word-chip{display:flex;align-items:center;gap:7px;background:#301958;border:1px solid #684a9e;border-radius:999px;padding:6px 9px;font-size:.82rem}.word-chip button{border:0;background:transparent;color:#f4b3c3;padding:0;font-weight:900}
/* Game */
.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.stat-pill{border:1px solid #7656b1;border-radius:999px;padding:8px 12px;background:#251146;font-size:.82rem;color:#d9ceff;font-weight:800}.game-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(230px,.8fr);gap:15px}.word-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.word-tile{border:1px solid #8f72d0;background:linear-gradient(180deg,#f9eac5,#e4cda0);color:#3b2458;border-radius:12px;min-height:54px;padding:7px 5px;font-weight:900;box-shadow:0 3px 0 #b38b54;font-size:.82rem;overflow-wrap:anywhere}.word-tile:hover{filter:brightness(1.08);transform:translateY(-1px)}.word-tile:disabled{background:#3e2b5c;color:#9283ae;border-color:#594276;box-shadow:none;text-decoration:line-through}.turn-banner{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;background:linear-gradient(100deg,#5525a0,#311763);border:1px solid #8c6bd4}.turn-banner strong{display:block}.turn-banner small{color:#dacaff}.timer{font-size:1.5rem;font-weight:1000;color:var(--yellow);font-variant-numeric:tabular-nums}.history-list{display:grid;gap:7px;max-height:350px;overflow:auto}.history-item{display:flex;align-items:flex-start;gap:8px;background:rgba(16,7,37,.45);border-radius:10px;padding:9px;font-size:.8rem}.history-num{min-width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#47277b;color:#fff;font-weight:900}.history-item small{display:block;color:var(--muted);margin-top:3px}.quick-vote{margin-top:12px;border:1px dashed #e7a9ff;background:rgba(109,52,162,.24);color:#f2e3ff;padding:10px 12px;border-radius:12px;font-weight:850;width:100%}
.reveal-wrap{text-align:center;max-width:700px;margin:0 auto}.reveal-symbol{width:94px;height:94px;margin:10px auto 16px;border-radius:28px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#b89bff,#612bb4 60%,#32115c);border:2px solid #d9c6ff;box-shadow:0 0 0 7px rgba(131,82,219,.22),0 15px 35px rgba(0,0,0,.28);font-size:2.6rem}.secret-word{font-size:clamp(2rem,7vw,3.5rem);font-weight:1000;color:var(--yellow);text-shadow:0 4px #7a3909;letter-spacing:.03em;margin:10px 0}.reveal-avatar{width:140px;margin:10px auto}.role-banner{border-radius:18px;padding:20px;border:1px solid #9c7be0;background:linear-gradient(150deg,#421b79,#1b0e3f)}.role-banner.impostor{border-color:#f25075;background:linear-gradient(150deg,#641838,#25103d)}.vote-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}.vote-target{border:1px solid #6d50a8;border-radius:14px;background:#241346;padding:12px 6px;text-align:center;color:#fff;min-width:0}.vote-target.selected{border:2px solid var(--yellow);background:#4b2b89;box-shadow:0 0 0 2px rgba(255,211,66,.1)}.vote-target .player-symbol{margin:0 auto 7px}.vote-target small{display:block;color:#c8b6ef}.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result-hero{text-align:center;padding:24px;border-radius:20px;background:radial-gradient(circle at 50% 0,#5833a4,#201044 65%);border:1px solid #8d6acf}.result-hero .big-emoji{font-size:3.5rem}.role-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(190,164,255,.15)}.role-row:last-child{border:0}.role-chip{border-radius:999px;padding:5px 8px;font-size:.73rem;font-weight:900}.role-chip.normal{background:#15503f;color:#b8ffdf}.role-chip.impostor{background:#65203e;color:#ffd0dc}
.modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(6,3,17,.74);display:grid;place-items:center;padding:20px}.modal{width:min(480px,100%);border-radius:20px;background:#231047;border:1px solid #9776dc;padding:22px;box-shadow:0 30px 90px #0008}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);line-height:1.55}.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.status-banner{border:1px solid rgba(255,212,71,.25);background:rgba(70,48,15,.25);color:#e6d4aa;padding:10px 12px;border-radius:12px;font-size:.78rem;line-height:1.5;margin-bottom:12px}
@media(max-width:820px){.app-shell{padding:14px 13px 10px}.avatar-editor{grid-template-columns:1fr}.avatar-preview-panel{position:relative;top:auto;padding:14px}.avatar-preview-panel .avatar-stage{width:min(220px,70vw)}.option-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.game-layout{grid-template-columns:1fr}.room-card-grid{grid-template-columns:1fr}.results-grid{grid-template-columns:1fr}.game-sidebar{display:grid;grid-template-columns:1fr 1fr;gap:12px}.history-list{max-height:240px}}
@media(max-width:520px){.app-shell{padding:10px 10px 8px;gap:12px}.topbar{min-height:44px}.brand{font-size:1.3rem}.v1-badge{font-size:.64rem;padding:6px 8px}.icon-btn{height:32px;width:32px}.panel{padding:15px;border-radius:18px}.form-grid{grid-template-columns:1fr}.home{gap:14px}.home-logo{font-size:2.75rem}.hero-avatar-wrap{width:220px}.home-actions .btn{min-height:55px}.page-head{flex-direction:column}.option-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.option-art{height:90px}.word-board{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.word-tile{min-height:50px;font-size:.78rem}.game-sidebar{grid-template-columns:1fr}.vote-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.settings-footer{align-items:stretch;flex-direction:column}.settings-footer .btn{width:100%}.code-info-row{grid-template-columns:1fr}.footer{font-size:.74rem}}
.gallery-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.gallery-heading h3{font-size:1.05rem;margin:0}.color-swatch-large{display:block;width:62px;height:62px;border-radius:18px;border:2px solid rgba(255,255,255,.55);box-shadow:inset 0 2px 3px #ffffff30,0 6px 12px #0003}.fallback-art{display:none}
.mini-avatar-wrap{width:56px;height:74px;overflow:hidden;position:relative}.mini-avatar-wrap .avatar-stage{width:56px;height:74px}.mini-avatar-wrap .avatar-layer{max-width:none}

/* V1 avatar previews in room, turn order, voting and result screens */
.player-avatar-cell,.turn-avatar-cell,.result-avatar-cell{display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.player-avatar-cell{width:44px;height:58px;}
.player-avatar-cell .mini-avatar-wrap,.result-avatar-cell .mini-avatar-wrap,.turn-avatar-cell .mini-avatar-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.player-avatar-cell .mini-avatar-wrap .avatar-stage,.result-avatar-cell .mini-avatar-wrap .avatar-stage,.turn-avatar-cell .mini-avatar-wrap .avatar-stage{width:100%;height:100%;}
.vote-target .mini-avatar-wrap{display:block;width:66px;height:88px;margin:0 auto 7px;overflow:hidden;}
.vote-target .mini-avatar-wrap .avatar-stage{width:100%;height:100%;}
.turn-avatar-cell{width:48px;height:64px;}
.result-avatar-cell{width:34px;height:46px;}
.reveal-avatar .avatar-stage{width:140px;height:186px;margin:0 auto;}
@media(max-width:520px){
  .player-avatar-cell{width:38px;height:51px;}
  .vote-target .mini-avatar-wrap{width:54px;height:72px;}
  .turn-avatar-cell{width:42px;height:56px;}
  .reveal-avatar .avatar-stage{width:120px;height:160px;}
}

/* ================================
   KAKOLARK V2 — redesigned start screen
   ================================ */
body.home-mode{background:#26066d;background-image:radial-gradient(ellipse at 50% 28%,rgba(104,51,220,.7),transparent 43%),radial-gradient(ellipse at 50% 100%,rgba(58,15,140,.85),transparent 56%),linear-gradient(180deg,#2f0b83 0%,#23065f 70%,#190746 100%);}
body.home-mode .app-shell{width:100%;max-width:none;min-height:100svh;height:auto;padding:0;gap:0;display:block;}
body.home-mode .topbar,body.home-mode .footer{display:none!important;}

  function escapeHTML(value) {

  function hueOf(hex) {
    let s=hex.replace('#',''); if(s.length===3) s=s.split('').map(c=>c+c).join('');
    let r=parseInt(s.slice(0,2),16)/255,g=parseInt(s.slice(2,4),16)/255,b=parseInt(s.slice(4,6),16)/255;
    let max=Math.max(r,g,b),min=Math.min(r,g,b),h=0,l=(max+min)/2,d=max-min;
    if(d!==0){if(max===r)h=((g-b)/d+(g<b?6:0));else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
    let sat=d===0?0:d/(1-Math.abs(2*l-1));
    return {h,sat,l};
  }
  function colorFilter(hex, sourceHue=24) {
    const c=hueOf(hex);
    if(c.sat<.10) {
      const brightness=Math.max(.55,Math.min(1.45,c.l/.48));
      return `grayscale(1) brightness(${brightness.toFixed(2)}) contrast(1.03)`;
    }
    return `hue-rotate(${Math.round(c.h-sourceHue)}deg) saturate(${Math.max(.75,Math.min(1.8,1.15+c.sat*.35)).toFixed(2)})`;
  }

  // Limpeza de salas vazias: fila carimbada no servidor + conferência de presenças.

  async function runRoomJanitor(){
    if(!fb.ready||!fb.user||!fb.db||fb.janitorBusy)return;
    fb.janitorBusy=true;
    try{
      const [queueSnap,indexSnap]=await Promise.all([dbPath('cleanupQueue').once('value'),dbPath('publicIndex').once('value')]);
      const queue=queueSnap.val()||{},index=indexSnap.val()||{};fb.onlineIndex=index;
      const codes=new Set([...Object.keys(queue),...Object.keys(index)]);
      const visible=[];
      for(const code of codes){
        if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code))continue;
        const queueRef=dbPath(`cleanupQueue/${code}/emptySince`);
        let markedAt=Number(queue[code]?.emptySince||0);
        const presenceSnap=await dbPath(`rooms/${code}/presence`).once('value').catch(()=>null);
        const presence=presenceSnap?.val()||{};const count=Object.keys(presence).length;
        if(count>0){
          if(markedAt)await queueRef.remove().catch(()=>{});
          const roomIndex=index[code];
          if(roomIndex&&roomIndex.visibility==='public'&&roomIndex.status==='open'&&count<Number(roomIndex.maxPlayers||0))visible.push({...roomIndex,playerCount:count,players:Array.from({length:count},(_,i)=>({id:`public-${i}`,name:`Jogador ${i+1}`}))});
          continue;
        }
        if(!markedAt){
          // Também inicializa a contagem das salas antigas que ainda não tinham a rotina de limpeza.
          await queueRef.set(window.firebase.database.ServerValue.TIMESTAMP).catch(()=>{});markedAt=Date.now();
        }
        if(Date.now()-markedAt>=ROOM_EMPTY_TTL_MS){
          // A regra de segurança do banco só autoriza esta remoção quando presence está vazio e o prazo venceu.
          await dbPath(`rooms/${code}`).remove().catch(()=>{});
          await dbPath(`publicIndex/${code}`).remove().catch(()=>{});
          await queueRef.remove().catch(()=>{});
        }
      }
      state.onlineRooms=visible.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      if(state.view==='join'&&!state.lookedUpRoom)renderJoin();
    }catch(err){console.warn('KAKOLARK room janitor',err);}
    finally{fb.janitorBusy=false;}
  }

      const liveCount=Object.keys(presenceSnap.val()||{}).length;
      if(!existing&&room.status!=='open')throw new Error('Essa sala não está aberta para novos jogadores.');
      if(!existing&&liveCount>=room.maxPlayers)throw new Error('Essa sala está cheia.');
      if(!existing&&room.visibility==='private'){
        if(!password)throw new Error('Essa sala é privada. Digite a senha para entrar.');
        // The database security rule only accepts this private attempt if its password matches the master-only password node.
        await dbPath(`rooms/${normalized}/access/attempts/${fb.user.uid}`).set({password:String(password),at:Date.now()});
      }
      {
        const playerRef=dbPath(`rooms/${normalized}/public/players/${fb.user.uid}`);
        const profilePatch={name:state.nickname||'Jogador',gender:state.gender,avatarPresetId:state.avatarPresetId,avatar:JSON.parse(JSON.stringify(state.avatar))};
        if(!existing) await playerRef.set({...profilePatch,color:playerColor(room.players.length),joinedAt:Date.now(),connected:true});
        else await playerRef.update(profilePatch);
      }
      storageSet(V5_STORAGE.roomCode,normalized);state.lookedUpRoom=null;state.lookupCode=normalized;state.lobbyTab='settings';
      await listenOnlineRoom(normalized);
      const latest=await dbPath(`rooms/${normalized}/public/meta/status`).once('value');
      if(latest.val()==='open')state.view='lobby';
      else if(state.game?.phase==='results')state.view='results';
      else if(state.game?.phase==='vote')state.view='vote';
      else if(state.game?.phase==='quickVote')state.view='quickVote';
      else if(state.game?.gameId&&!hasSeenReveal(normalized,state.game.gameId))state.view='reveal';
      else state.view='game';
      await updatePublicCount(normalized).catch(()=>{});render();notice(resuming?'Sessão reconectada.':`Você entrou na sala ${normalized}.`);
    }catch(err){console.error(err);const msg=String(err?.message||err);if(msg.includes('PERMISSION_DENIED')||msg.includes('permission_denied'))notice('Senha incorreta ou acesso negado pelas regras do Firebase.','error');else notice(msg,'error');}
  }
  async function listenOnlineRoom(code) {
    detachRoomListeners();fb.currentCode=code;
    fb.roomRef=dbPath(`rooms/${code}/public`);
    fb.roomRef.on('value',snap=>{
      if(!snap.exists()){state.room=null;state.game=null;state.view='home';render();notice('A sala não existe mais.','warn');return;}
      const data=snap.val(), previousGameId=state.game?.gameId,previousStatus=state.room?.status,previousEliminationId=state.game?.lastElimination?.id||null;
      const room=roomFromPublic(code,data);state.room=room;state.roomIsMaster=isRoomMaster(room);state.game=data.game||null;
      const newlyEliminated=(previousGameId===state.game?.gameId && state.game?.lastElimination && state.game.lastElimination.id!==previousEliminationId)?state.game.lastElimination:null;
      if(state.roomIsMaster){attachHostGameListener(code);updatePublicIndexAsMaster().catch(()=>{});}
      else if(fb.hostRef){try{fb.hostRef.off();}catch{}fb.hostRef=null;state.hostGame=null;detachActionWatcher();}
      if(fb.user && !fb.secretRef){
        fb.secretRef=dbPath(`rooms/${code}/secrets/${fb.user.uid}`);
        fb.secretRef.on('value',sec=>{state.mySecret=sec.val()||null;if(state.view==='reveal')render();});
      }
      if(!state.game&&room.status==='open'&&['game','vote','quickVote','reveal','results'].includes(state.view)){state.hostGame=null;state.mySecret=null;state.view='lobby';state.selectedVote=new Set();}
      else if(state.game?.phase==='results')state.view='results';
      else if(state.game?.phase==='vote')state.view='vote';
      else if(state.game?.phase==='quickVote')state.view='quickVote';
      else if(state.game?.phase==='playing'){
        if(previousGameId!==state.game.gameId && !hasSeenReveal(code,state.game.gameId))state.view='reveal';
        else if(['lobby','results','vote','quickVote'].includes(state.view))state.view=hasSeenReveal(code,state.game.gameId)?'game':'reveal';
      } else if(room.status==='open' && previousStatus && previousStatus!=='open')state.view='lobby';
      if(['lobby','game','vote','quickVote','results','reveal'].includes(state.view))render();
      if(newlyEliminated){
        const role=newlyEliminated.role==='impostor'?'era um IMPOSTOR 😈':'era um jogador normal';
        notice(`${newlyEliminated.name} foi eliminado e ${role}.`,'warn');
      }
      if(state.roomIsMaster){attachHostGameListener(code);ensureHostTick();}
    },err=>{console.error(err);notice(friendlyFirebaseError(err),'error');});
    fb.connectedRef=dbPath(`rooms/${code}/public/players/${fb.user.uid}/connected`);
    fb.connectedRef.set(true).catch(()=>{});fb.connectedRef.onDisconnect().set(false).catch(()=>{});
    watchPresenceForRoom(code).catch(err=>console.warn('KAKOLARK presence setup',err));
  }
  let attachedHostCode=null;
  function attachHostGameListener(code) {
    if(!isRoomMaster()||!fb.ready)return;
    if(attachedHostCode===code&&fb.hostRef)return;
    if(fb.hostRef)try{fb.hostRef.off();}catch{}
    attachedHostCode=code;fb.hostRef=dbPath(`rooms/${code}/host/game`);
    fb.hostRef.on('value',snap=>{
      state.hostGame=snap.val()||null;
      if(state.hostGame){attachHostWatchers();ensureHostTick();}
      if(state.view==='lobby'&&state.game?.phase)routeGameView();
    },err=>{console.error(err);notice(friendlyFirebaseError(err),'error');});
  }
  async function updatePublicIndexAsMaster() {
    const r=state.room;if(!r||!isRoomMaster()||r.visibility!=='public')return;
    const presence=await dbPath(`rooms/${r.code}/presence`).once('value');const count=Object.keys(presence.val()||{}).length;
    const queueRef=dbPath(`cleanupQueue/${r.code}/emptySince`);
    if(count===0||r.status!=='open'){
      await dbPath(`publicIndex/${r.code}`).remove().catch(()=>{});
      const marker=await queueRef.once('value').catch(()=>null);
      if(!marker?.exists())await queueRef.set(window.firebase.database.ServerValue.TIMESTAMP).catch(()=>{});
      return;
    }
    await queueRef.remove().catch(()=>{});
    await dbPath(`publicIndex/${r.code}`).set({code:r.code,name:r.name,visibility:'public',maxPlayers:r.maxPlayers,playerCount:count,status:r.status,rounds:r.rounds,masterUid:fb.user.uid,createdAt:r.createdAt||Date.now(),emptySince:0});
  }
  function routeGameView() {
    if(!state.game)return;
    if(state.game.phase==='results')state.view='results';else if(state.game.phase==='vote')state.view='vote';else if(state.game.phase==='quickVote')state.view='quickVote';else if(!hasSeenReveal(state.room?.code,state.game.gameId))state.view='reveal';else state.view='game';
    render();
  }
  async function leaveOnlineRoom() {
    const room=state.room;if(!room||!fb.ready||!fb.user){state.view='home';state.room=null;render();return;}
    const code=room.code,me=fb.user.uid,isMaster=isRoomMaster(room);
    try{
      const presenceSnap=await dbPath(`rooms/${code}/presence`).once('value');
      const activeIds=Object.keys(presenceSnap.val()||{}).filter(uid=>uid!==me);
      if(isMaster&&activeIds.length){
        const next=activeIds[0];
        await dbPath(`rooms/${code}/public/meta`).update({masterUid:next,playerCount:activeIds.length});
      } else if(isMaster&&!activeIds.length){
        await dbPath(`rooms/${code}/public/meta/status`).set('closed').catch(()=>{});
        await dbPath(`cleanupQueue/${code}/emptySince`).set(window.firebase.database.ServerValue.TIMESTAMP).catch(()=>{});
        if(room.visibility==='public')await dbPath(`publicIndex/${code}`).remove().catch(()=>{});
      }
      await dbPath(`rooms/${code}/public/players/${me}`).remove().catch(()=>{});
      await dbPath(`rooms/${code}/presence/${me}`).remove().catch(()=>{});
      const remain=await dbPath(`rooms/${code}/presence`).once('value');
      const remainingCount=Object.keys(remain.val()||{}).length;
      if(remainingCount===0)await dbPath(`cleanupQueue/${code}/emptySince`).set(window.firebase.database.ServerValue.TIMESTAMP).catch(()=>{});
      else await dbPath(`cleanupQueue/${code}/emptySince`).remove().catch(()=>{});
      if(isMaster&&activeIds.length&&room.visibility==='public'){
        await dbPath(`publicIndex/${code}`).update({masterUid:activeIds[0],playerCount:activeIds.length}).catch(()=>{});
      }
    }catch(err){console.warn('Leave room error',err);}
    detachRoomListeners();state.room=null;state.game=null;state.hostGame=null;state.mySecret=null;state.view='home';state.roomIsMaster=false;storageSet(V5_STORAGE.roomCode,'');render();
    runRoomJanitor().catch(()=>{});
  }

  async function startGame(){
    if(!state.room || !isRoomMaster()) return;
    const room = state.room;
    if(!firebaseUserReady()){notice('Conectando ao Firebase. Aguarde antes de iniciar.','warn');return;}
    if(room.players.length < 3){notice('São necessários pelo menos 3 jogadores reais para iniciar.','warn');return;}
    if(room.players.length > Number(room.maxPlayers)){notice('A sala excedeu a quantidade configurada de jogadores.','error');return;}
    if(Number(room.impostors) < 1 || Number(room.impostors) >= room.players.length){notice('A quantidade de impostores deve ser entre 1 e o total de jogadores menos 1.','error');return;}
    const code = room.code;
    let prepared = false;
    try{
      // Mark the room as starting first, so nobody can slip into the player list while secret roles are written.
      await setRoomStatus(code,'starting');
      const secret = chooseSecret(room), alt = chooseAltWord(secret);
      const shuffled = shuffle(room.players.map(p=>p.id));
      const impostorIds = shuffled.slice(0,Number(room.impostors));
      const roles = {};
      room.players.forEach(p => roles[p.id] = impostorIds.includes(p.id) ? 'impostor' : 'normal');
      const gameId = `${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
      const game = {
        gameId, phase:'playing', secret, alt, roles, impostorIds,

        board:makeBoard(secret, Number(room.rounds)*room.players.length+room.players.length, room.customWords||[]),
        usedWords:[], history:[], eliminated:[], turnOrder:shuffle(room.players.map(p=>p.id)), turnIndex:0,
        turnStartedAt:0, roundVotes:[], finalVotes:[], finalCounts:{}, winner:null, winMessage:'',
        quickVoteUsed:false, quickVoteOpen:false, quickVoteHistory:[], votesSubmittedCount:0,
        votesNeeded:room.players.length, startedAt:Date.now()
      };
      // Write each player's private role to the private path; the public game never carries these fields mid-game.
      await Promise.all(room.players.map(p => {
        const role = roles[p.id];
        const partners = role==='impostor' ? impostorIds.filter(id=>id!==p.id).map(id=>room.players.find(pl=>pl.id===id)?.name).filter(Boolean) : [];
        return dbPath(`rooms/${code}/secrets/${p.id}`).set({gameId,role,word:role==='impostor'?alt:secret,partnerNames:partners});
      }));
      await dbPath(`rooms/${code}/host/game`).set(game);
      await dbPath(`rooms/${code}/public/game`).set(publicGamePayload(game));
      await setRoomStatus(code,'in-game');
      prepared = true;
      state.hostGame = game;
      state.mySecret = {gameId,role:roles[fb.user.uid],word:roles[fb.user.uid]==='impostor'?alt:secret,partnerNames:roles[fb.user.uid]==='impostor'?impostorIds.filter(id=>id!==fb.user.uid).map(id=>room.players.find(p=>p.id===id)?.name).filter(Boolean):[]};
      state.view='reveal';state.selectedVote=new Set();state.voteSubmittedKey='';state.quickVoteSubmittedKey='';
      render();notice('Partida iniciada! Sua identidade foi revelada apenas nesta tela.');attachHostWatchers();ensureHostTick();
    }catch(err){
      console.error(err);
      if(!prepared){
        await Promise.all([
          dbPath(`rooms/${code}/host/game`).remove().catch(()=>{}),
          dbPath(`rooms/${code}/public/game`).remove().catch(()=>{}),
          dbPath(`rooms/${code}/secrets`).remove().catch(()=>{}),
          setRoomStatus(code,'open').catch(()=>{})
        ]);
      }
      notice(friendlyFirebaseError(err),'error');

  }

    if(!getActivePlayers().some(isMe)){notice('Jogadores eliminados não podem votar.','warn');return;}
    const key=state.game.gameId;
    if(state.quickVoteSubmittedKey===key){notice('Seu voto já foi registrado.','warn');return;}
    const path=`rooms/${state.room.code}/actions/quickVotes/${key}/${fb.user.uid}`;
    try{
      const prior=await dbPath(path).once('value');
      if(prior.exists()){state.quickVoteSubmittedKey=key;renderQuickVote();notice('Seu voto já havia sido registrado.','warn');return;}
      await dbPath(path).set({answer:!!approvedByMe,at:Date.now()});state.quickVoteSubmittedKey=key;renderQuickVote();notice('Voto da proposta registrado.');
    }catch(err){notice(friendlyFirebaseError(err),'error');}
  }
  function renderQuickVote(){
    const g=state.game,active=getActivePlayers(),key=g?.gameId;
    const submitted=state.quickVoteSubmittedKey===key;
    if(key && firebaseUserReady() && state.quickVoteCheckedKey!==key){
      state.quickVoteCheckedKey=key;
      dbPath(`rooms/${state.room.code}/actions/quickVotes/${key}/${fb.user.uid}`).once('value').then(snap=>{
        if(state.game?.phase==='quickVote' && state.game.gameId===key && snap.exists()){state.quickVoteSubmittedKey=key;renderQuickVote();}
      }).catch(()=>{});
    }
    app.innerHTML=`<section class="screen panel quick-vote-modal game-screen-v63">${privateSecretBarHTML(g)}<div class="result-hero"><div class="big-emoji">⚡</div><div class="eyebrow">VOTAÇÃO RÁPIDA</div><h1 class="section-title">Encerrar as rodadas agora?</h1><p class="section-sub">Se pelo menos metade dos jogadores ativos aprovar, iremos diretamente para a votação final. Os papéis continuam secretos.</p></div><div class="panel-lite"><p>Jogadores ativos: <strong>${active.length}</strong></p><p class="helper">Aguardando os votos. A proposta será resolvida automaticamente quando todos votarem ou o tempo acabar.</p></div>${active.some(isMe)?submitted?`<div class="status-banner">Seu voto foi registrado. Aguarde os demais jogadores.</div>`:`<div class="modal-actions two-choice" style="margin-top:16px"><button class="btn btn-ghost" data-action="quick-vote-answer" data-answer="no">Não, continuar</button><button class="btn btn-primary" data-action="quick-vote-answer" data-answer="yes">Sim, ir à votação</button></div>`:`<div class="status-banner warning">Você está eliminado e não participa desta proposta.</div>`}</section>`;
  }
  async function requestPlayAgain(){
    if(!state.room||state.game?.phase!=='results')return;
    if(isRoomMaster())return resetRoomToLobby();
    try{await dbPath(`rooms/${state.room.code}/actions/playAgain/${state.game.gameId}/${fb.user.uid}`).set({at:Date.now()});notice('Pedido enviado ao mestre para voltar ao lobby.');}
    catch(err){notice(friendlyFirebaseError(err),'error');}
  }
  function renderResults(){
    const g=state.game;if(!g){state.view='lobby';render();return;}const normalsWon=g.winner==='normals',players=state.room.players,roles=players.map((p,i)=>({p,role:g.roles?.[p.id]||'normal',i})),finalVotes=g.finalVotes||[];
    app.innerHTML=`<section class="screen panel"><div class="result-hero"><div class="big-emoji">${normalsWon?'🏆':'😈'}</div><div class="eyebrow">FIM DE JOGO</div><h1 class="section-title" style="font-size:clamp(1.8rem,5vw,3rem)">${normalsWon?'VITÓRIA DOS JOGADORES NORMAIS':'VITÓRIA DOS IMPOSTORES'}</h1><p class="section-sub">${escapeHTML(g.winMessage||'A partida terminou.')}</p></div>
      <div class="results-grid" style="margin-top:16px"><div class="panel-lite"><h2 class="section-title" style="font-size:1.2rem">Papéis revelados</h2>${roles.map(({p,role,i})=>`<div class="role-row"><div style="display:flex;align-items:center;gap:9px"><div class="result-avatar-cell">${tinyAvatar(p.gender||'masculino',p.avatar||initialSelections(),i,p.avatarPresetId)}</div><div><strong>${escapeHTML(p.name)}</strong><small class="helper">${(g.eliminated||[]).includes(p.id)?'Eliminado':'Terminou a partida'}</small></div></div><span class="role-chip ${role==='impostor'?'impostor':'normal'}">${role==='impostor'?'😈 IMPOSTOR':'NORMAL'}</span></div>`).join('')}</div>
      <div class="panel-lite"><h2 class="section-title" style="font-size:1.2rem">Palavras da partida</h2><p>Palavra normal: <strong class="gold-text">${escapeHTML(g.secret)}</strong></p><p>Palavra dos impostores: <strong class="gold-text">${escapeHTML(g.alt)}</strong></p><p class="helper">Palavras escolhidas: ${g.history?.length||0}</p><div class="history-list">${(g.history||[]).slice().reverse().slice(0,20).map(h=>`<div class="history-item"><span class="history-num">${h.round}</span><div><strong>${escapeHTML(h.playerName)}</strong>: ${escapeHTML(h.word)}${h.automatic?' <small>(automática)</small>':''}</div></div>`).join('')}</div></div></div>
      ${finalVotes.length?`<div class="panel-lite" style="margin-top:14px"><h2 class="section-title" style="font-size:1.2rem">Votação final — votos públicos</h2><p class="section-sub">Os votos só ficam expostos depois da partida.</p><div class="player-list">${finalVotes.map(v=>{const voter=players.find(p=>p.id===v.voterId);return `<div class="player-row public-vote-row"><span class="vote-color-dot" style="--vote-color:${escapeHTML(v.color||voter?.color||'#9d77ff')}"></span><div class="grow"><strong>${escapeHTML(v.voterName)}</strong><small>Acusou: ${(v.targetNames||[]).map(escapeHTML).join(', ')||'ninguém'}</small></div></div>`}).join('')}</div></div>`:''}
      ${g.lastElimination?`<div class="panel-lite" style="margin-top:14px"><strong>Última eliminação:</strong> ${escapeHTML(g.lastElimination.name)} — ${g.lastElimination.role==='impostor'?'Impostor':'Jogador normal'}.</div>`:''}
      <div class="settings-footer"><span class="helper">${isRoomMaster()?'Você pode retornar todos ao lobby.':'Você pode pedir para retornar ao lobby.'}</span><button class="btn btn-primary" data-action="play-again">JOGAR NOVAMENTE ↻</button></div></section>`;
  }
  function render(){
    saveProfile();document.body.classList.toggle('home-mode',state.view==='home');
    switch(state.view){case 'home':clearTimers();renderHome();break;case 'avatar':clearTimers();renderAvatarEditor();break;case 'create':clearTimers();renderCreate();break;case 'join':clearTimers();renderJoin();break;case 'lobby':clearTimers();renderLobby();break;case 'reveal':clearTimers();renderReveal();break;case 'game':renderGame();break;case 'vote':clearTimers();renderVote();break;case 'quickVote':clearTimers();renderQuickVote();break;case 'results':clearTimers();renderResults();break;default:state.view='home';renderHome();}
  }
  function askConfirm(title,message,confirmText,callback){modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>${escapeHTML(title)}</h2><p>${escapeHTML(message)}</p><div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="confirm-modal">${escapeHTML(confirmText)}</button></div></div></div>`;state.modal=callback;}
  function handleClick(e){
    const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;
    switch(a){
      case 'home': if(state.room)leaveOnlineRoom();else{state.view='home';render();}break;
      case 'avatar':if($('#home-nickname'))state.nickname=$('#home-nickname').value.trim();state.view='avatar';render();break;
      case 'save-avatar':saveAvatarAndProfile().catch(err=>{console.error(err);notice(friendlyFirebaseError(err),'error');});break;
      case 'gender':{const nextGender=btn.dataset.gender;const fallback=AVATAR_PRESETS[nextGender]?.[0];if(fallback)applyAvatarPreset(fallback.id);saveProfile();render();break;}
      case 'pick-avatar-preset':applyAvatarPreset(btn.dataset.presetId);saveProfile();render();break;
      case 'category':state.category=btn.dataset.category;render();break;
      case 'color-category':state.colorCategory=btn.dataset.colorCategory;render();break;
      case 'pick-color':state.avatar.colors[btn.dataset.colorCategory]=btn.dataset.color;saveProfile();render();break;
      case 'pick-option':{const cat=btn.dataset.category,n=Number(btn.dataset.option);state.avatar[cat]=n;if(cat==='cabelo_curto'&&n)state.avatar.cabelo_longo=0;if(cat==='cabelo_longo'&&n)state.avatar.cabelo_curto=0;if(cat==='cabelo_curto'&&!n)state.avatar.cabelo_longo=0;if(cat==='cabelo_longo'&&!n)state.avatar.cabelo_curto=0;if(cat==='roupa_casual')state.avatar.roupa_tematica=0;if(cat==='roupa_tematica')state.avatar.roupa_casual=0;saveProfile();render();break;}
      case 'create':if($('#home-nickname'))state.nickname=$('#home-nickname').value.trim();if(!state.nickname){notice('Escolha seu nick primeiro.','warn');return;}createWords=[];state.view='create';render();break;
      case 'join':if($('#home-nickname'))state.nickname=$('#home-nickname').value.trim();if(!state.nickname){notice('Escolha seu nick primeiro.','warn');return;}state.view='join';state.lookedUpRoom=null;render();break;
      case 'add-create-word':addWordToCreate();break;case 'remove-create-word':createWords.splice(Number(btn.dataset.index),1);updateCreateWordList();break;
      case 'lobby-tab':state.lobbyTab=btn.dataset.tab;render();break;case 'save-lobby-settings':saveLobbySettings();break;case 'add-lobby-word':addLobbyWord();break;case 'remove-lobby-word':removeLobbyWord(Number(btn.dataset.index));break;
      case 'copy-code':if(state.room?.code)navigator.clipboard?.writeText(state.room.code).then(()=>notice('Código copiado.')).catch(()=>notice(`Código da sala: ${state.room.code}`));break;
      case 'start-game':startGame();break;case 'continue-game':confirmRevealAndContinue();break;case 'choose-word':chooseBoardWord(btn.dataset.wordId);break;
      case 'quick-vote':openQuickVoteProposal();break;case 'quick-vote-answer':resolveQuickVote(btn.dataset.answer==='yes');break;case 'return-game':if(state.game?.phase==='quickVote'){notice('A proposta está em andamento até todos votarem.','warn');}break;
      case 'join-public':enterRoom(btn.dataset.code);break;case 'join-looked-up':if(state.lookedUpRoom)enterRoom(state.lookedUpRoom.code);break;case 'refresh-rooms':renderJoin();notice('Lista de salas públicas atualizada.');break;
      case 'vote-target':toggleVote(btn.dataset.playerId);break;case 'submit-vote':submitOnlineVote();break;case 'simulate-vote':notice('Simulação de votos foi removida no modo online.','warn');break;
      case 'play-again':requestPlayAgain();break;
      case 'retry-firebase': window.location.reload(); break;
      case 'help':askConfirm('Como funciona o KAKOLARK','Crie uma sala pública ou privada, compartilhe o código com seus amigos, receba seu papel em particular e descubra quem está blefando. Salas online usam Firebase; se aparecer erro de permissão, publique as regras do pacote e habilite login anônimo no console do Firebase.','Entendi',()=>{});break;
      case 'close-modal':modalRoot.innerHTML='';state.modal=null;break;case 'confirm-modal':{const cb=state.modal;modalRoot.innerHTML='';state.modal=null;if(cb)cb();break;}
    }
  }
  async function handleSubmit(e){
    if(e.target.id==='create-form'){e.preventDefault();await createRoom(e.target);}
    if(e.target.id==='lookup-form'){e.preventDefault();await lookupOnlineRoom($('#lookup-code')?.value||'');}
    if(e.target.id==='password-form'){e.preventDefault();const password=$('#join-password')?.value||'';if(state.lookedUpRoom)await enterOnlineRoom(state.lookedUpRoom.code,password,false);}
  }
  function handleChange(e){if(e.target.id==='room-visibility'){const f=$('#password-field');if(f)f.hidden=e.target.value!=='private';} }
  function updateActiveGameRoute(){ if(state.game)routeGameView(); }
  async function removeStaleRoomCode(){const code=storageGet(V5_STORAGE.roomCode);if(code&&!state.room)storageSet(V5_STORAGE.roomCode,'');}
  app.addEventListener('click',handleClick);app.addEventListener('submit',e=>{handleSubmit(e).catch(err=>{console.error(err);notice(friendlyFirebaseError(err),'error');});});
  app.addEventListener('input',e=>{if(e.target.id==='home-nickname'||e.target.id==='avatar-nick'){state.nickname=e.target.value.slice(0,18);saveProfile();}});
  app.addEventListener('change',handleChange);modalRoot.addEventListener('click',handleClick);

  initializeOnlineBackend();
  render();
})();

  </script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('KAKOLARK PWA', err)));
    }
  </script>
</body>
